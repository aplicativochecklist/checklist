        .field-group label { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .field-group input, .field-group select { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }

        .checklist-item input[type="checkbox"] { margin-right: 12px; transform: scale(1.2); }
        .badge-qtd { background: #e0e0e0; color: #333; font-weight: bold; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .extra-section { margin-top: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 4px; background: #fdfdfd; }
        .extra-row { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; }
        .extra-row input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .term-box { border: 1px solid #333; padding: 15px; margin-top: 25px; border-radius: 4px; background: #fafafa; font-size: 12px; text-align: justify; }
        .signature-area { display: flex; justify-content: space-between; margin-top: 15px; gap: 10px; flex-wrap: wrap; }
        .signature-field { flex: 1; min-width: 150px; display: flex; flex-direction: column; }
        .term-acceptance { display: flex; align-items: center; background: #fffde7; padding: 10px; margin-top: 15px; font-weight: bold; }
        button { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; width: 100%; font-weight: bold; }

    function renderizarUI() {
        const container = document.getElementById("checklist-container");
        checklistData.forEach((item, index) => {
            container.innerHTML += `<div class="checklist-item"><div class="item-info"><input type="checkbox" id="item-${index}" onchange="checklistData[${index}].checked=this.checked"><label>${item.text}</label></div><div class="badge-qtd">Qtd: ${item.qtd}</div></div>`;
        });
    }

    async function salvarDados() {
        const dados = {
            tecnico: document.getElementById("nomeTecnico").value,
            cpf: document.getElementById("cpfTecnico").value,
            filial: document.getElementById("filialSelect").value,
            assinatura: document.getElementById("assinaturaTecnico").value,
            local: document.getElementById("localAssinatura").value,
            data: document.getElementById("dataAtual").value,
            itens: checklistData
        };

        try {
            document.querySelector("button").innerText = "Salvando...";
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            alert("Enviado com sucesso!");
            location.reload();
        } catch (e) {
            alert("Erro ao salvar.");
        }
    }
    renderizarUI();
